<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ExplainedLAB By Jasper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><circle cx=%225%22 cy=%225%22 r=%224%22 fill=%22%2300D9FF%22/></svg>">
<style>
:root{color-scheme:dark;--bg:#07111F;--bg2:#0b1b30;--card:#0d2038;--bd:#173556;--tx:#fff;--mu:#9db2cc;--cy:#00D9FF;--bl:#1e6bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:var(--cy);text-decoration:none}h1,h2,h3{line-height:1.2;margin:0 0 .5em}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,17,31,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;gap:20px;height:64px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:#fff;display:flex;align-items:center;gap:8px;cursor:pointer}.logo:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy)}.logo b{color:var(--cy)}
nav a.l{color:var(--mu);font-weight:600;font-size:15px}nav a.l:hover,nav a.on{color:var(--cy)}.sp{flex:1}
.btn{background:var(--cy);color:#04121f;border:0;border-radius:10px;padding:10px 18px;font:700 15px inherit;font-family:inherit;cursor:pointer;transition:.2s;display:inline-block}
.btn:hover{box-shadow:0 0 22px rgba(0,217,255,.5);transform:translateY(-1px)}.btn.o{background:none;color:var(--cy);border:1px solid var(--cy)}.btn.d{background:#ff4d6a;color:#fff}.btn.s{padding:6px 12px;font-size:13px}
.hero{padding:90px 0 70px;background:radial-gradient(800px 400px at 80% 0,rgba(30,107,255,.3),transparent),radial-gradient(500px 300px at 10% 100%,rgba(0,217,255,.15),transparent)}
.hero h1{font-size:clamp(36px,7vw,64px);font-weight:800;max-width:760px}.hero h1 em{color:var(--cy);font-style:normal;text-shadow:0 0 30px rgba(0,217,255,.5)}
.hero p{color:var(--mu);max-width:560px;font-size:18px}.badge{display:inline-block;background:rgba(30,107,255,.18);color:#4d9bff;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;letter-spacing:.04em;margin-bottom:18px}
.sec{padding:56px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;transition:.25s;display:flex;flex-direction:column;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:var(--cy);box-shadow:0 10px 30px rgba(0,217,255,.12)}
.th{height:150px;background:linear-gradient(135deg,#0f3a73,#073a52);background-size:cover;background-position:center}.cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{font-size:19px;margin:0}.cb p{color:var(--mu);margin:0;font-size:14px;flex:1}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mu);align-items:center}.tag{color:var(--cy);background:rgba(0,217,255,.1);padding:2px 10px;border-radius:99px;font-weight:600}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select,textarea{background:var(--bg2);border:1px solid var(--bd);color:#fff;border-radius:10px;padding:11px 14px;font:inherit;width:100%}input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:2px solid var(--cy);border-color:transparent}
.bar input{flex:1;min-width:200px}.bar select{width:auto}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:none;color:var(--mu);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}.chip.on{background:var(--cy);color:#04121f;border-color:var(--cy)}
.art{max-width:760px;margin:0 auto;padding:40px 20px 80px}.art h1{font-size:clamp(30px,5vw,44px)}.cov{width:100%;border-radius:16px;margin:20px 0;border:1px solid var(--bd)}
.body{font-size:17px}.body h2{margin-top:1.6em;color:var(--cy)}.body img{max-width:100%;border-radius:10px}.body table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}.body td,.body th{border:1px solid var(--bd);padding:8px 12px}.body blockquote{border-left:3px solid var(--cy);margin:1em 0;padding-left:16px;color:var(--mu)}
.refs{margin-top:40px;padding:20px;background:var(--card);border:1px solid var(--bd);border-radius:14px}.refs li{color:var(--mu);margin:6px 0;word-break:break-word}
.empty{text-align:center;color:var(--mu);padding:50px 20px;border:1px dashed var(--bd);border-radius:16px}
footer{border-top:1px solid var(--bd);padding:28px 0;color:var(--mu);font-size:13px}footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.lg{min-height:80vh;display:grid;place-items:center;padding:20px}.lc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:34px;max-width:400px;width:100%;box-shadow:0 0 60px rgba(0,217,255,.12);text-align:center}.lc p{color:var(--mu)}.err{color:#ff6b84;margin-top:12px;font-size:14px}
.adm{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}.side{background:var(--bg2);border-right:1px solid var(--bd);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side a{color:var(--mu);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}.side a.on,.side a:hover{background:rgba(0,217,255,.1);color:var(--cy)}.main{padding:28px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:20px 0}.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}.stat b{font-size:34px;color:var(--cy);display:block}
.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}.row .t{flex:1;min-width:180px;font-weight:600}.st{font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(255,190,50,.15);color:#ffbe32}.st.p{background:rgba(0,217,255,.12);color:var(--cy)}
.f{display:grid;gap:14px}.f label{font-size:13px;color:var(--mu);font-weight:600;display:grid;gap:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tb{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px 10px 0 0}.tb button{background:var(--card);color:#fff;border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}.tb button:hover{border-color:var(--cy)}
#ce{min-height:320px;background:var(--bg2);border:1px solid var(--bd);border-top:0;border-radius:0 0 10px 10px;padding:16px}
@media(max-width:760px){.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}.side a{white-space:nowrap}.main{padding:18px}.two{grid-template-columns:1fr}nav .w{height:auto;padding:10px 20px;gap:12px}}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://kiiczpjqifynjxczpqls.supabase.co',SB_KEY='sb_publishable_ZQt3Ua8oi7pNPaAcFrBrIA_0oIx4gD-';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$('#app');
let isAdmin=false,all=[],pub=[],drafts=[],cats=[],site={name:'Explained'},ed=null,q='',cat='',sort='new',pg=1,loadErr='';
const PAGE=6,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
function clean(h){const d=new DOMParser().parseFromString(h||'','text/html');d.querySelectorAll('script,iframe,object,embed,style,link').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))e.removeAttribute(a.name)}));return d.body.innerHTML}
const lg=()=>`<div class="logo" onclick="go('home')">${esc(site.name||'Explained')}<b>LAB</b></div>`;
const go=h=>{location.hash=h};
const sorted=l=>[...l].sort((a,b)=>sort=='new'?(b.date||'').localeCompare(a.date||''):(a.date||'').localeCompare(b.date||''));
const norm=r=>({id:r.id,title:r.title,desc:r.description,cat:r.category||'',date:r.published_at,created:(r.created_at||'').slice(0,10),updated:r.updated_at&&r.updated_at.slice(0,10)!=(r.created_at||'').slice(0,10)?r.updated_at.slice(0,10):'',cover:r.cover_url||'',html:r.content_html,refs:r.refs,files:r.files||[],status:r.status});
async function load(){const [r,c,s]=await Promise.all([sb.from('reports').select('*'),sb.from('categories').select('name').order('name'),sb.from('settings').select('value').eq('key','site').maybeSingle()]);
loadErr=r.error?r.error.message:'';all=(r.data||[]).map(norm);pub=all.filter(x=>x.status=='published');drafts=all.filter(x=>x.status!='published');cats=(c.data||[]).map(x=>x.name);if(s.data)site={...site,...s.data.value};render()}
function card(r){return `<div class="card" onclick="go('r-${r.id}')"><div class="th" style="${r.cover?`background-image:url('${esc(r.cover)}')`:''}"></div><div class="cb"><div class="meta"><span class="tag">${esc(r.cat||'General')}</span><span>${fd(r.date)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><span class="btn s o" style="align-self:flex-start">Read Research</span></div></div>`}
const none=t=>`<div class="empty">${t}</div>`;
function nav(h){const a=(k,t)=>`<a class="l ${h==k?'on':''}" href="#${k}">${t}</a>`;return `<nav><div class="w">${lg()}<span class="sp"></span>${a('home','Home')}${a('research','Research')}${a('about','About')}${a('contact','Contact')}<a class="btn s" href="#${isAdmin?'admin':'login'}">${isAdmin?'Dashboard':'Admin Login'}</a></div></nav>`}
const foot=`<footer><div class="w"><span class="badge" style="margin:0">RESEARCH PLATFORM</span><span>Research. Science. Knowledge. · EST. 2026</span></div></footer>`;
function archive(list){const f=sorted(list.filter(r=>(!cat||r.cat==cat)&&(!q||((r.title||'')+(r.desc||'')).toLowerCase().includes(q.toLowerCase()))));const s=f.slice(0,PAGE*pg);return `<div class="bar"><input id="q" placeholder="Search research…" value="${esc(q)}" oninput="q=this.value;pg=1;sch()"><select onchange="sort=this.value;render()"><option value="new" ${sort=='new'?'selected':''}>Newest first</option><option value="old" ${sort=='old'?'selected':''}>Oldest first</option></select></div><div class="chips" style="margin-bottom:22px"><button class="chip ${cat?'':'on'}" onclick="cat='';pg=1;render()">All</button>${cats.map((c,i)=>`<button class="chip ${cat==c?'on':''}" onclick="cat=cats[${i}];pg=1;render()">${esc(c)}</button>`).join('')}</div>${s.length?`<div class="grid">${s.map(card).join('')}</div>`:none('No research found.')}${f.length>s.length?`<p style="text-align:center;margin-top:26px"><button class="btn o" onclick="pg++;render()">Load more</button></p>`:''}`}
let t;function sch(){clearTimeout(t);t=setTimeout(()=>{const p=$('#q').selectionStart;render();const i=$('#q');if(i){i.focus();i.setSelectionRange(p,p)}},250)}
function pubPage(h){const s=sorted(pub);
if(h=='home')return `<section class="hero"><div class="w"><span class="badge">RESEARCH PLATFORM</span><h1>Research. <em>Understand.</em> Improve.</h1><p>${esc(site.name)}LAB publishes research and educational reports that help you understand the science and explore the evidence.</p><br><a class="btn" href="#research">Explore Research</a></div></section><section class="sec"><div class="w"><h2>Latest Research</h2>${loadErr?none('Could not load research: '+esc(loadErr)):s.length?`<div class="grid">${s.slice(0,6).map(card).join('')}</div>`:none('No research published yet.')}</div></section>`;
if(h=='research')return `<section class="sec"><div class="w"><h1>Research Archive</h1>${archive(pub)}</div></section>`;
if(h=='about')return `<section class="sec"><div class="w art"><h1>About</h1><p class="body">${esc(site.about||'Understand the science. Explore the evidence. '+site.name+'LAB is a research publication platform dedicated to clear, evidence-based reports.')}</p></div></section>`;
if(h=='contact')return `<section class="sec"><div class="w art"><h1>Contact</h1><p class="body">${site.email?`Reach us at <a href="mailto:${esc(site.email)}">${esc(site.email)}</a>.`:'Contact details coming soon.'}</p></div></section>`;
if(h.startsWith('r-')){const r=pub.find(x=>x.id==h.slice(2));return r?article(r):`<div class="art">${none('Research not found.')}</div>`}
return ''}
function article(r){const refs=(r.refs||'').split('\n').filter(x=>x.trim());return `<div class="art"><a href="#research">← Back to Research</a><br><br><div class="meta"><span class="tag">${esc(r.cat||'General')}</span><span>Published ${fd(r.date)}</span>${r.updated?`<span>· Updated ${fd(r.updated)}</span>`:''}</div><h1>${esc(r.title)}</h1>${r.cover?`<img class="cov" src="${esc(r.cover)}" alt="">`:''}<div class="body">${clean(r.html)}</div>${(r.files||[]).length?`<div class="refs"><h3>Download the full report</h3>${r.files.map(f=>`<p><a class="btn s o" href="${esc(f.url)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a></p>`).join('')}</div>`:''}${refs.length?`<div class="refs"><h3>Sources &amp; References</h3><ol>${refs.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}<br><a class="btn o" href="#research">Back to Research</a></div>`}
function login(){return `<div class="lg"><div class="lc" onkeydown="if(event.key=='Enter')doLogin()">${lg().replace('class="logo"','class="logo" style="justify-content:center;margin-bottom:10px"')}<h2>Admin Login</h2><div class="f" style="text-align:left"><label>Email<input id="le" type="email" autocomplete="username" placeholder="you@example.com"></label><label>Password<div style="position:relative"><input id="lp" type="password" autocomplete="current-password" style="padding-right:64px"><button type="button" onclick="const i=$('#lp'),s=i.type=='password';i.type=s?'text':'password';this.textContent=s?'Hide':'Show'" style="position:absolute;right:8px;top:7px;background:none;border:0;color:var(--cy);cursor:pointer;font:inherit">Show</button></div></label><button class="btn" onclick="doLogin()">Login</button></div><div class="err" id="lerr"></div><p style="margin-top:18px"><a href="#home">← Back to site</a></p></div></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error){$('#lerr').textContent='Incorrect email or password.';return}isAdmin=true;await load();go('admin')}
const logout=async()=>{await sb.auth.signOut();isAdmin=false;go('home');render()};
const AN=[['admin','Overview'],['admin-all','All Research'],['admin-new','Create Research'],['admin-cats','Categories'],['admin-settings','Website Settings']];
function admin(h){let c='';
if(h=='admin')c=`<h1>Overview</h1><div class="stats"><div class="stat"><b>${pub.length}</b>Published reports</div><div class="stat"><b>${drafts.length}</b>Drafts</div><div class="stat"><b>${cats.length}</b>Categories</div></div><a class="btn" href="#admin-new" onclick="ed=null">+ New report</a><h3 style="margin-top:30px">Recently published</h3>${sorted(pub).slice(0,4).map(r=>`<div class="row"><span class="t">${esc(r.title)}</span><span class="meta">${fd(r.date)}</span></div>`).join('')||none('Nothing published yet.')}`;
else if(h=='admin-all'){const l=[...all].sort((a,b)=>(b.date||b.created||'').localeCompare(a.date||a.created||''));c=`<h1>All Research</h1>${l.map(r=>{const p=r.status=='published';return `<div class="row"><span class="t">${esc(r.title||'Untitled')}</span><span class="st ${p?'p':''}">${p?'Published':'Draft'}</span><span class="meta">${fd(r.date||r.created)}</span><button class="btn s o" onclick="edit('${r.id}')">Edit</button><button class="btn s ${p?'o':''}" onclick="toggle('${r.id}')">${p?'Unpublish':'Publish'}</button><button class="btn s d" onclick="del('${r.id}')">Delete</button></div>`}).join('')||none('No reports yet.')}`}
else if(h=='admin-new')c=editor();
else if(h=='admin-cats')c=`<h1>Categories</h1><div class="bar"><input id="nc" placeholder="New category name"><button class="btn" onclick="addCat()">Add</button></div>${cats.map((x,i)=>`<div class="row"><span class="t">${esc(x)}</span><button class="btn s d" onclick="rmCat(${i})">Remove</button></div>`).join('')||none('No categories yet.')}`;
else if(h=='admin-settings')c=`<h1>Website Settings</h1><div class="f" style="max-width:520px"><label>Site name (shown before “LAB”)<input id="sn" value="${esc(site.name)}"></label><label>About text<textarea id="sa" rows="5">${esc(site.about||'')}</textarea></label><label>Contact email<input id="se" value="${esc(site.email||'')}"></label><button class="btn" onclick="saveSite()">Save settings</button></div>`;
return `<div class="adm"><div class="side">${AN.map(([k,t])=>`<a class="${h==k?'on':''}" onclick="${k=='admin-new'?'ed=null;':''}go('${k}')">${t}</a>`).join('')}<a onclick="logout()">Logout</a></div><div class="main">${c}</div></div>`}
function editor(){const e=ed||{};return `<h1>${e.id?'Edit':'Create'} Research</h1><div class="f"><label>Title<input id="et" value="${esc(e.title)}"></label><label>Short description<textarea id="ed" rows="2">${esc(e.desc)}</textarea></label><div class="two"><label>Category<select id="ec"><option value="">Uncategorised</option>${cats.map(c=>`<option ${e.cat==c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Publication date<input type="date" id="edt" value="${(e.date||today()).slice(0,10)}"></label></div><label>Cover image<input type="file" id="cf" accept="image/*" onchange="upl(this)"></label><div id="cp">${e.cover?`<img src="${esc(e.cover)}" style="max-height:100px;border-radius:8px">`:''}</div><label>PDF files (full report, appendices…)<input type="file" accept="application/pdf" multiple onchange="upf(this)"></label><div id="fl">${fl(e.files)}</div><div><div class="tb"><button onclick="ex('bold')"><b>B</b></button><button onclick="ex('italic')"><i>I</i></button><button onclick="ex('formatBlock','h2')">H2</button><button onclick="ex('formatBlock','h3')">H3</button><button onclick="ex('formatBlock','p')">¶</button><button onclick="ex('insertUnorderedList')">• List</button><button onclick="ex('insertOrderedList')">1. List</button><button onclick="ex('formatBlock','blockquote')">Quote</button><button onclick="lnk()">Link</button><button onclick="tbl()">Table</button><button onclick="$('#if').click()">Image</button><input id="if" type="file" accept="image/*" hidden onchange="imgIn(this)"></div><div id="ce" contenteditable="true">${clean(e.html)}</div></div><label>Sources &amp; references (one per line)<textarea id="er" rows="4">${esc(e.refs)}</textarea></label><div class="bar"><button class="btn o" onclick="preview()">Preview</button><button class="btn o" onclick="save(0)">Save draft</button><button class="btn" onclick="save(1)">${e.status=='published'?'Update published':'Publish'}</button></div><div id="pv"></div></div>`}
const ex=(c,v)=>{$('#ce').focus();document.execCommand(c,false,v)};
const lnk=()=>{const u=prompt('Link URL (https://…)');if(u&&/^https?:|^mailto:/.test(u))ex('createLink',u)};
const tbl=()=>ex('insertHTML','<table><tr><th>Header</th><th>Header</th></tr><tr><td>Cell</td><td>Cell</td></tr></table><p></p>');
async function up(f){if(!f)return;const n=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');const{error}=await sb.storage.from('covers').upload(n,f);if(error){alert('Upload failed: '+error.message);return}return sb.storage.from('covers').getPublicUrl(n).data.publicUrl}
async function upl(i){const u=await up(i.files[0]);if(u){ed={...collect(),cover:u};$('#cp').innerHTML=`<img src="${esc(u)}" style="max-height:100px;border-radius:8px">`}}
const fl=l=>(l||[]).map((f,i)=>`<div class="row"><span class="t">📄 ${esc(f.name)}</span><button class="btn s d" onclick="rmf(${i})">Remove</button></div>`).join('');
async function upf(i){const l=[...((ed&&ed.files)||[])];for(const f of i.files){if(f.type!='application/pdf'){alert(f.name+' is not a PDF.');continue}const u=await up(f);if(u)l.push({name:f.name,url:u})}ed={...collect(),files:l};$('#fl').innerHTML=fl(l);i.value=''}
const rmf=i=>{const l=[...ed.files];l.splice(i,1);ed={...collect(),files:l};$('#fl').innerHTML=fl(l)};
async function imgIn(i){const u=await up(i.files[0]);if(u){$('#ce').focus();ex('insertImage',u)}}
function collect(){return {...(ed||{}),title:$('#et').value.trim(),desc:$('#ed').value.trim(),cat:$('#ec').value,date:$('#edt').value||today(),html:clean($('#ce').innerHTML),refs:$('#er').value}}
function preview(){const r=collect();$('#pv').innerHTML=`<div style="border:1px solid var(--cy);border-radius:14px;margin-top:10px">${article(r)}</div>`;$('#pv').scrollIntoView({behavior:'smooth'})}
async function save(p){const r=collect();if(!r.title){alert('Please add a title.');return}const o={title:r.title,description:r.desc,category:r.cat||null,published_at:r.date,content_html:r.html,refs:r.refs,cover_url:r.cover||null,files:r.files||[],status:p?'published':'draft',updated_at:new Date().toISOString()};
const{error}=r.id?await sb.from('reports').update(o).eq('id',r.id):await sb.from('reports').insert(o);if(error){alert('Save failed: '+error.message);return}ed=null;await load();go('admin-all')}
function edit(id){ed=all.find(x=>x.id==id);go('admin-new');render()}
async function toggle(id){const r=all.find(x=>x.id==id);const{error}=await sb.from('reports').update({status:r.status=='published'?'draft':'published',updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()}
async function del(id){if(confirm('Delete this report permanently?')){const{error}=await sb.from('reports').delete().eq('id',id);if(error)alert(error.message);await load()}}
async function addCat(){const v=$('#nc').value.trim();if(!v)return;const{error}=await sb.from('categories').insert({name:v});if(error)alert(error.message);await load()}
async function rmCat(i){await sb.from('categories').delete().eq('name',cats[i]);await load()}
async function saveSite(){const{error}=await sb.from('settings').upsert({key:'site',value:{name:$('#sn').value.trim()||'Explained',about:$('#sa').value,email:$('#se').value.trim()}});alert(error?error.message:'Saved.');await load()}
