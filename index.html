window.addEventListener('resize',()=>{if($('#sbox'))drawSel()});

window.addEventListener('keydown',e=>{if(location.hash!='#admin-editor'||!$('.ed'))return;const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),inp=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
if(m&&k=='s'){e.preventDefault();saveSite()}else if(m&&k=='z'&&!inp){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&k=='y'&&!inp){e.preventDefault();redo()}});
render();
sb.auth.getSession().then(({data})=>{isAdmin=!!data.session;load()});
</script></body></html>
