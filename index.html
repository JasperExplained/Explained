loadErr=r.error?r.error.message:'';all=(r.data||[]).map(norm);pub=all.filter(x=>x.status=='published');drafts=all.filter(x=>x.status!='published');cats=(c.data||[]).map(x=>x.name);

if(!s.error){loaded=true;if(s.data&&s.data.value){site={...s.data.value};site.t=site.t||{};site.th=site.th||{};site.css=site.css||''}}render()}

function card(r){return `<div class="card" onclick="go('r-${r.id}')"><div class="th" style="${r.cover?`background-image:url('${esc(r.cover)}')`:''}"></div><div class="cb"><div class="meta"><span class="tag">${esc(r.cat)||tx('general')}</span><span>${fd(r.date)}</span></div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><span class="btn s o" style="align-self:flex-start">${tx('read_btn')}</span></div></div>`}

const none=t=>`<div class="empty">${t}</div>`;

function nav(h){const a=(k,t)=>`<a class="l ${h==k?'on':''}" href="#${k}">${t}</a>`;return `<nav><div class="w">${lg()}<span class="sp"></span>${a('home',tx('nav_home'))}${a('research',tx('nav_research'))}${a('about',tx('nav_about'))}${a('contact',tx('nav_contact'))}<a class="btn s" href="#${isAdmin?'admin':'login'}">${isAdmin?tx('nav_dash'):tx('nav_login')}</a></div></nav>`}

const foot=()=>`<footer><div class="w"><span class="badge" style="margin:0">${tx('foot_l')}</span><span>${tx('foot_r')}</span></div></footer>`;

function archive(list){const f=sorted(list.filter(r=>(!cat||r.cat==cat)&&(!q||((r.title||'')+(r.desc||'')).toLowerCase().includes(q.toLowerCase()))));const s=f.slice(0,PAGE*pg);return `<div class="bar"><input id="q" placeholder="${tx('search_ph')}" value="${esc(q)}" oninput="q=this.value;pg=1;sch()"><select onchange="sort=this.value;render()"><option value="new" ${sort=='new'?'selected':''}>${tx('sort_new')}</option><option value="old" ${sort=='old'?'selected':''}>${tx('sort_old')}</option></select></div><div class="chips" style="margin-bottom:22px"><button class="chip ${cat?'':'on'}" onclick="cat='';pg=1;render()">${tx('all')}</button>${cats.map((c,i)=>`<button class="chip ${cat==c?'on':''}" onclick="cat=cats[${i}];pg=1;render()">${esc(c)}</button>`).join('')}</div>${s.length?`<div class="grid">${s.map(card).join('')}</div>`:none(tx('none'))}${f.length>s.length?`<p style="text-align:center;margin-top:26px"><button class="btn o" onclick="pg++;render()">${tx('load_more')}</button></p>`:''}`}

let t;function sch(){clearTimeout(t);t=setTimeout(()=>{const p=$('#q').selectionStart;render();const i=$('#q');if(i){i.focus();i.setSelectionRange(p,p)}},250)}

function pubPage(h){const s=sorted(pub),th=site.th;

if(h=='home'){const hi=th.heroImg?`background-image:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url('${encodeURI(th.heroImg).replace(/'/g,'%27')}');background-size:cover;background-position:center`:'';

return `<section class="hero" style="${hi}"><div class="w">${th.noBadge?'':`<span class="badge">${tx('badge')}</span>`}<h1>${tx('h1a')} <em>${tx('h1b')}</em> ${tx('h1c')}</h1><p>${tx('hero_p')}</p><br><a class="btn" href="#research">${tx('hero_btn')}</a></div></section>${th.noLatest?'':`<section class="sec"><div class="w"><h2>${tx('latest_h')}</h2>${loadErr?none('Could not load research: '+esc(loadErr)):s.length?`<div class="grid">${s.slice(0,6).map(card).join('')}</div>`:none(tx('latest_empty'))}</div></section>`}${raw('x_h')||raw('x_p')?`<section class="sec"><div class="w"><h2>${tx('x_h')}</h2><p class="body" style="white-space:pre-line">${tx('x_p')}</p></div></section>`:''}`}

if(h=='research')return `<section class="sec"><div class="w"><h1>${tx('arch_h')}</h1>${archive(pub)}</div></section>`;

if(h=='about')return `<section class="sec"><div class="w art"><h1>${tx('about_h')}</h1><p class="body" style="white-space:pre-line">${tx('about')}</p></div></section>`;

if(h=='contact'){const e=raw('email');return `<section class="sec"><div class="w art"><h1>${tx('contact_h')}</h1><p class="body">${e?`${tx('contact_pre')} <a href="mailto:${esc(e)}">${esc(e)}</a>.`:tx('contact_none')}</p></div></section>`}

if(h.startsWith('r-')){const r=pub.find(x=>x.id==h.slice(2));return r?article(r):`<div class="art">${none('Research not found.')}</div>`}

return ''}

function article(r){const refs=(r.refs||'').split('\n').filter(x=>x.trim());return `<div class="art"><a href="#research">${tx('back')}</a><br><br><div class="meta"><span class="tag">${esc(r.cat)||tx('general')}</span><span>${tx('published')} ${fd(r.date)}</span>${r.updated?`<span>· ${tx('updated')} ${fd(r.updated)}</span>`:''}</div><h1>${esc(r.title)}</h1>${r.cover?`<img class="cov" src="${esc(r.cover)}" alt="">`:''}<div class="body">${clean(r.html)}</div>${(r.files||[]).length?`<div class="refs"><h3>${tx('dl_h')}</h3>${r.files.map(f=>`<p><a class="btn s o" href="${esc(f.url)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a></p>`).join('')}</div>`:''}${refs.length?`<div class="refs"><h3>${tx('refs_h')}</h3><ol>${refs.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}<br><a class="btn o" href="#research">${tx('back2')}</a></div>`}

function login(){return `<div class="lg"><div class="lc" onkeydown="if(event.key=='Enter')doLogin()">${lg().replace('class="logo"','class="logo" style="justify-content:center;margin-bottom:10px"')}<h2>Admin Login</h2><div class="f" style="text-align:left"><label>Email<input id="le" type="email" autocomplete="username" placeholder="you@example.com"></label><label>Password<div style="position:relative"><input id="lp" type="password" autocomplete="current-password" style="padding-right:64px"><button type="button" onclick="const i=$('#lp'),s=i.type=='password';i.type=s?'text':'password';this.textContent=s?'Hide':'Show'" style="position:absolute;right:8px;top:7px;background:none;border:0;color:var(--cy);cursor:pointer;font:inherit">Show</button></div></label><button class="btn" onclick="doLogin()">Login</button></div><div class="err" id="lerr"></div><p style="margin-top:18px"><a href="#home">← Back to site</a></p></div></div>`}

async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error){$('#lerr').textContent='Incorrect email or password.';return}isAdmin=true;await load();go('admin')}

const logout=async()=>{await sb.auth.signOut();isAdmin=false;go('home');render()};

const AN=[['admin','Overview'],['admin-all','All Research'],['admin-new','Create Research'],['admin-cats','Categories'],['admin-editor','Website Editor']];



/* ---------- WEBSITE EDITOR ---------- */

let pvDevice='desktop';
function chooseSeason(name){preset(name);}
function editorPage(){const th={...TH,...site.th};
const groups={};F.forEach(f=>(groups[f[0]]=groups[f[0]]||[]).push(f));
const txt=Object.entries(groups).map(([g,l])=>`<details><summary>${g}</summary><div class="f">${l.map(([,k,lb,,m])=>`<label>${esc(lb)}${m?`<textarea rows="4" oninput="sT('${k}',this.value)">${esc(raw(k))}</textarea>`:`<input value="${esc(raw(k))}" oninput="sT('${k}',this.value)">`}</label>`).join('')}</div></details>`).join('');
const pages=[['home','Home'],['research','Research'],['about','About'],['contact','Contact']].concat(pub.length?[['r-'+pub[0].id,'Article']]:[]);
const seasons=[['Ocean Lab','🌊','#00D9FF'],['Christmas','🎄','#55e6b0'],['Winter','❄️','#8be4ff'],['Summer','☀️','#32e1e8'],['Fall','🍂','#f2a34a']];
const active=Object.entries(PR).find(([k,v])=>k!=='Clean Light'&&k!=='Emerald'&&k!=='Royal'&&k!=='Journal'&&JSON.stringify(v)===JSON.stringify(site.th));
return `<div class="editor-head"><h1>Website Editor</h1><p class="meta">Build and customize the whole ExplainedLAB experience.</p></div>
<div class="editor-top"><span class="season-label">● Live preview</span><span class="save-status" id="sst">✓ Up to date</span><span class="grow"></span><button class="btn s o" onclick="undoSite()" title="Undo">↶ Undo</button><button class="btn s o" onclick="redoSite()" title="Redo">↷ Redo</button><button class="btn s o" onclick="resetAll()">Reset</button><button class="btn s" onclick="saveSiteNow()">Save changes</button></div>
<div class="ed2"><div class="ctl">
<details open><summary>Seasonal themes</summary><p class="meta" style="margin:10px 0 12px">Choose a complete seasonal look. You can still customize every color afterwards.</p><div class="season-grid">${seasons.map(([k,emoji,color])=>`<button class="season-btn ${((site.th.season||'ocean')==({ 'Ocean Lab':'ocean','Christmas':'christmas','Winter':'winter','Summer':'summer','Fall':'fall'}[k]))?'active':''}" onclick="chooseSeason('${k}')"><span class="season-dot" style="background:${color}"></span>${emoji} ${k}</button>`).join('')}</div></details>
<details open><summary>Appearance &amp; colors</summary><div class="f"><div class="two">${CF.map(([k,l])=>`<label>${l}<input type="color" value="${th[k]}" oninput="sTh('${k}',this.value)"></label>`).join('')}</div>
<label>Font<select onchange="sTh('font',this.value)">${FONTS.map(f=>`<option ${th.font==f?'selected':''}>${f}</option>`).join('')}</select></label>
<label>Corner roundness (${th.r}px)<input type="range" min="0" max="32" value="${th.r}" oninput="this.parentNode.firstChild.textContent='Corner roundness ('+this.value+'px)';sTh('r',+this.value)"></label>
<label>Content width (${th.w}px)<input type="range" min="900" max="1400" step="20" value="${th.w}" oninput="this.parentNode.firstChild.textContent='Content width ('+this.value+'px)';sTh('w',+this.value)"></label></div></details>
<details open><summary>Background &amp; effects</summary><div class="f"><p class="meta">Ambient color accents now continue behind every section, from navigation to footer.</p><label class="ck"><input type="checkbox" ${th.ambient===false?'':'checked'} onchange="sTh('ambient',this.checked)">Full-page ambient gradients</label><label class="ck"><input type="checkbox" ${th.motion===false?'':'checked'} onchange="sTh('motion',this.checked)">Smooth theme transitions</label><label>Hero background image URL (optional)<input value="${esc(site.th.heroImg||'')}" placeholder="https://…" oninput="sTh('heroImg',this.value.trim())"></label><label class="ck"><input type="checkbox" ${site.th.noBadge?'checked':''} onchange="sTh('noBadge',this.checked)">Hide hero badge</label><label class="ck"><input type="checkbox" ${site.th.noLatest?'checked':''} onchange="sTh('noLatest',this.checked)">Hide “Latest research” on home</label></div></details>
<details><summary>Navigation &amp; page content</summary><div class="f"><p class="meta">Edit the text shown throughout your website.</p></div></details>${txt}
<details><summary>Custom CSS (advanced)</summary><div class="f"><label>Extra CSS for the live website<textarea rows="8" oninput="site.css=this.value;updPv();sv()" placeholder=".hero h1{letter-spacing:-1px}">${esc(site.css)}</textarea></label></div></details>
</div><div class="pvbox"><div class="preview-heading"><h2>Website preview</h2><select style="width:auto;max-width:170px" onchange="pvp=this.value;updPv()">${pages.map(([k,l])=>`<option value="${k}" ${pvp==k?'selected':''}>${l}</option>`).join('')}</select></div><div class="bar" style="margin:0 0 10px"><select style="width:auto" value="${pvDevice}" onchange="pvDevice=this.value;applyPreviewDevice()"><option value="desktop" ${pvDevice==='desktop'?'selected':''}>Desktop</option><option value="tablet" ${pvDevice==='tablet'?'selected':''}>Tablet</option><option value="mobile" ${pvDevice==='mobile'?'selected':''}>Mobile</option></select><a class="btn s o" href="#home">View live website</a></div><div class="preview-shell"><div id="pvw" class="sk device-${pvDevice}"></div></div></div></div>`}

function applyPreviewDevice(){const el=$('#pvw');if(!el)return;el.classList.remove('device-desktop','device-tablet','device-mobile');el.classList.add('device-'+pvDevice)}
function updPv(){const el=$('#pvw');if(!el)return;theme(el,site.th);applyPreviewDevice();if(!el._b){el._b=1;el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()},true)}el.innerHTML=nav(pvp)+(pubPage(pvp)||pubPage('home'))+foot();const old=el.querySelector('#preview-custom-css');if(old)old.remove();if(site.css){const st=document.createElement('style');st.id='preview-custom-css';st.textContent=site.css;el.appendChild(st)}}


function admin(h){let c='';

if(h=='admin')c=`<h1>Overview</h1><div class="stats"><div class="stat"><b>${pub.length}</b>Published reports</div><div class="stat"><b>${drafts.length}</b>Drafts</div><div class="stat"><b>${cats.length}</b>Categories</div></div><a class="btn" href="#admin-new" onclick="ed=null">+ New report</a> <a class="btn o" href="#admin-editor">Edit website</a><h3 style="margin-top:30px">Recently published</h3>${sorted(pub).slice(0,4).map(r=>`<div class="row"><span class="t">${esc(r.title)}</span><span class="meta">${fd(r.date)}</span></div>`).join('')||none('Nothing published yet.')}`;

else if(h=='admin-all'){const l=[...all].sort((a,b)=>(b.date||b.created||'').localeCompare(a.date||a.created||''));c=`<h1>All Research</h1>${l.map(r=>{const p=r.status=='published';return `<div class="row"><span class="t">${esc(r.title||'Untitled')}</span><span class="st ${p?'p':''}">${p?'Published':'Draft'}</span><span class="meta">${fd(r.date||r.created)}</span><button class="btn s o" onclick="edit('${r.id}')">Edit</button><button class="btn s ${p?'o':''}" onclick="toggle('${r.id}')">${p?'Unpublish':'Publish'}</button><button class="btn s d" onclick="del('${r.id}')">Delete</button></div>`}).join('')||none('No reports yet.')}`}

else if(h=='admin-new')c=editor();

else if(h=='admin-cats')c=`<h1>Categories</h1><div class="bar"><input id="nc" placeholder="New category name"><button class="btn" onclick="addCat()">Add</button></div>${cats.map((x,i)=>`<div class="row"><span class="t">${esc(x)}</span><button class="btn s d" onclick="rmCat(${i})">Remove</button></div>`).join('')||none('No categories yet.')}`;

else if(h=='admin-editor')c=editorPage();

return `<div class="adm"><div class="side">${AN.map(([k,t])=>`<a class="${h==k?'on':''}" onclick="${k=='admin-new'?'ed=null;':''}go('${k}')">${t}</a>`).join('')}<a onclick="logout()">Logout</a></div><div class="main">${c}</div></div>`}

function editor(){const e=ed||{};return `<h1>${e.id?'Edit':'Create'} Research</h1><div class="f"><label>Title<input id="et" value="${esc(e.title)}"></label><label>Short description<textarea id="ed" rows="2">${esc(e.desc)}</textarea></label><div class="two"><label>Category<select id="ec"><option value="">Uncategorised</option>${cats.map(c=>`<option ${e.cat==c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Publication date<input type="date" id="edt" value="${(e.date||today()).slice(0,10)}"></label></div><label>Cover image<input type="file" id="cf" accept="image/*" onchange="upl(this)"></label><div id="cp">${e.cover?`<img src="${esc(e.cover)}" style="max-height:100px;border-radius:8px">`:''}</div><label>PDF files (full report, appendices…)<input type="file" accept="application/pdf" multiple onchange="upf(this)"></label><div id="fl">${fl(e.files)}</div><div><div class="tb"><button onclick="ex('bold')"><b>B</b></button><button onclick="ex('italic')"><i>I</i></button><button onclick="ex('formatBlock','h2')">H2</button><button onclick="ex('formatBlock','h3')">H3</button><button onclick="ex('formatBlock','p')">¶</button><button onclick="ex('insertUnorderedList')">• List</button><button onclick="ex('insertOrderedList')">1. List</button><button onclick="ex('formatBlock','blockquote')">Quote</button><button onclick="lnk()">Link</button><button onclick="tbl()">Table</button><button onclick="$('#if').click()">Image</button><input id="if" type="file" accept="image/*" hidden onchange="imgIn(this)"></div><div id="ce" contenteditable="true">${clean(e.html)}</div></div><label>Sources &amp; references (one per line)<textarea id="er" rows="4">${esc(e.refs)}</textarea></label><div class="bar"><button class="btn o" onclick="preview()">Preview</button><button class="btn o" onclick="save(0)">Save draft</button><button class="btn" onclick="save(1)">${e.status=='published'?'Update published':'Publish'}</button></div><div id="pv"></div></div>`}

const ex=(c,v)=>{$('#ce').focus();document.execCommand(c,false,v)};

const lnk=()=>{const u=prompt('Link URL (https://…)');if(u&&/^https?:|^mailto:/.test(u))ex('createLink',u)};

const tbl=()=>ex('insertHTML','<table><tr><th>Header</th><th>Header</th></tr><tr><td>Cell</td><td>Cell</td></tr></table><p></p>');

async function up(f){if(!f)return;const n=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');const{error}=await sb.storage.from('covers').upload(n,f);if(error){alert('Upload failed: '+error.message);return}return sb.storage.from('covers').getPublicUrl(n).data.publicUrl}

async function upl(i){const u=await up(i.files[0]);if(u){ed={...collect(),cover:u};$('#cp').innerHTML=`<img src="${esc(u)}" style="max-height:100px;border-radius:8px">`}}

const fl=l=>(l||[]).map((f,i)=>`<div class="row"><span class="t">📄 ${esc(f.name)}</span><button class="btn s d" onclick="rmf(${i})">Remove</button></div>`).join('');

async function upf(i){const l=[...((ed&&ed.files)||[])];for(const f of i.files){if(f.type!='application/pdf'){alert(f.name+' is not a PDF.');continue}const u=await up(f);if(u)l.push({name:f.name,url:u})}ed={...collect(),files:l};$('#fl').innerHTML=fl(l);i.value=''}

const rmf=i=>{const l=[...ed.files];l.splice(i,1);ed={...collect(),files:l};$('#fl').innerHTML=fl(l)};

async function imgIn(i){const u=await up(i.files[0]);if(u){$('#ce').focus();ex('insertImage',u)}}

function collect(){return {...(ed||{}),title:$('#et').value.trim(),desc:$('#ed').value.trim(),cat:$('#ec').value,date:$('#edt').value||today(),html:clean($('#ce').innerHTML),refs:$('#er').value}}

function preview(){const r=collect();$('#pv').innerHTML=`<div style="border:1px solid var(--cy);border-radius:14px;margin-top:10px">${article(r)}</div>`;$('#pv').scrollIntoView({behavior:'smooth'})}

async function save(p){const r=collect();if(!r.title){alert('Please add a title.');return}const o={title:r.title,description:r.desc,category:r.cat||null,published_at:r.date,content_html:r.html,refs:r.refs,cover_url:r.cover||null,files:r.files||[],status:p?'published':'draft',updated_at:new Date().toISOString()};

const{error}=r.id?await sb.from('reports').update(o).eq('id',r.id):await sb.from('reports').insert(o);if(error){alert('Save failed: '+error.message);return}ed=null;await load();go('admin-all')}

function edit(id){ed=all.find(x=>x.id==id);go('admin-new');render()}

async function toggle(id){const r=all.find(x=>x.id==id);const{error}=await sb.from('reports').update({status:r.status=='published'?'draft':'published',updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()}

async function del(id){if(confirm('Delete this report permanently?')){const{error}=await sb.from('reports').delete().eq('id',id);if(error)alert(error.message);await load()}}

async function addCat(){const v=$('#nc').value.trim();if(!v)return;const{error}=await sb.from('categories').insert({name:v});if(error)alert(error.message);await load()}

async function rmCat(i){await sb.from('categories').delete().eq('name',cats[i]);await load()}

function render(){const h=(location.hash||'#home').slice(1);if(document.activeElement&&document.activeElement.id=='ce')return;let b;

const adm=h=='login'||h.startsWith('admin');

if(h=='login'||(h.startsWith('admin')&&!isAdmin))b=nav(h)+login();else if(h.startsWith('admin'))b=nav(h)+admin(h);else b=nav(h)+(pubPage(h)||pubPage('home'))+foot();

theme(document.documentElement,adm?{}:site.th);theme(document.body,adm?{}:site.th);$('#cu').textContent=adm?'':site.css||'';

document.title=raw('name')+raw('accent');app.innerHTML=b;if(h=='admin-editor'&&isAdmin)updPv()}

window.addEventListener('hashchange',()=>{pg=1;render();scrollTo(0,0)});render();

sb.auth.getSession().then(({data})=>{isAdmin=!!data.session;load()});

</script></body></html>
